{% extends "dashboard/base.html" %}

{% block content %}

<h2 class="mb-4">👁️ عرض الوثيقة — {{ document.file_name }}</h2>

<div class="card p-4 shadow-sm">

    {% if document.file_name|lower|slice:"-4:" == ".pdf" %}
        <!-- عرض PDF -->
        <iframe src="{{ document.file_path }}" width="100%" height="850px" style="border: none;"></iframe>

    {% else %}
        <!-- عرض صورة -->
        <img src="{{ document.file_path }}" class="img-fluid" alt="Document Image">
    {% endif %}

</div>

<!-- أزرار التحكم -->
<div class="mt-3">
    <a href="{% url 'document_detail' document.id %}" class="btn btn-secondary">
        ↩ العودة إلى تفاصيل الوثيقة
    </a>
    <a href="{{ document.file_path }}" class="btn btn-success" download>
        ⬇️ تنزيل الوثيقة
    </a>
    <a href="{{ document.file_path }}" target="_blank" class="btn btn-info">
        🔎 فتح في نافذة جديدة
    </a>
</div>

{% endblock %}
