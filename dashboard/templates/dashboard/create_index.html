{% extends "dashboard/base.html" %}

{% block content %}

<h2 class="mb-4">➕ إضافة فهرس جديد — المشروع: {{ domain.title }}</h2>

<form method="POST" class="card p-4 shadow-sm">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">الاسم الرمزي للفهرس</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">الوصف</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-success">✔ حفظ الفهرس</button>
    <a href="{% url 'manage_human_indexes' %}" class="btn btn-secondary">↩ رجوع</a>
</form>

{% endblock %}
