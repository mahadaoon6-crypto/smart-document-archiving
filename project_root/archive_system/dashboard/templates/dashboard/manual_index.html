{% extends "dashboard/base.html" %}

{% block content %}

<div class="container">

    <h2 class="mb-4">الفهرسة اليدوية للوثيقة رقم {{ document.id }}</h2>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <strong>النص المستخرج</strong>
        </div>
        <div class="card-body">
            <pre class="p-3 bg-light border" style="white-space: pre-wrap;">
{{ ocr_text }}
            </pre>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-success text-white">
            <strong>التصنيف الحالي</strong>
        </div>
        <div class="card-body">
            <p><strong>النتيجة الحالية:</strong> {{ document.classification_result }}</p>
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="card mb-4">
            <div class="card-header bg-warning text-dark">
                <strong>تصحيح التصنيف</strong>
            </div>
            <div class="card-body">

                <label class="form-label">اختر التصنيف الصحيح:</label>
                <select name="corrected_label" class="form-select">
                    {% for idx in indexes %}
                        <option value="{{ idx.name }}">{{ idx.name }}</option>
                    {% endfor %}
                </select>

                <label class="form-label mt-3">ملاحظات (اختياري):</label>
                <textarea name="notes" class="form-control" rows="4"></textarea>

            </div>
        </div>

        <button class="btn btn-primary">حفظ التصحيح</button>

    </form>

</div>

{% endblock %}
